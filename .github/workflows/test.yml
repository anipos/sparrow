name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUBSUB_EMULATOR_HOST: localhost:8085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: ruby
        run: echo "version=$(sed -nE 's/^FROM ruby:([0-9.]+).*/\1/p' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}
          bundler-cache: true
      - run: bundle exec rubocop
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta,pubsub-emulator
      - run: |
          gcloud beta emulators pubsub start --host-port=$PUBSUB_EMULATOR_HOST > pubsub-emulator.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf "http://$PUBSUB_EMULATOR_HOST/v1/projects/ci/topics" > /dev/null && exit 0
            sleep 1
          done
          cat pubsub-emulator.log
          exit 1
      - run: bundle exec rspec
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rspec
          path: rspec/rspec.xml
      - run: bundle exec yardoc --fail-on-warning 'lib/**/*.rb'
